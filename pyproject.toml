[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grok-codex-native"
version = "0.1.0"
description = "Native Codex deployment and finite Grok task handoff"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Yongsul Kim"}]
dependencies = ["openai-codex==0.163.0", "pydantic==2.14.2", "packaging==26.3"]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
